# Cockpit AIOps (React, servi par nginx). Exposé en NodePort 30081.
# L'URL du backend est intégrée au moment du build de l'image (VITE_API_URL).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexshop-aiops-cockpit
  namespace: nexshop
  labels:
    app: nexshop-aiops-cockpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexshop-aiops-cockpit
  template:
    metadata:
      labels:
        app: nexshop-aiops-cockpit
    spec:
      containers:
        - name: cockpit
          image: mabroukamessaoudi1/nexshop-aiops-cockpit:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: nexshop-aiops-cockpit
  namespace: nexshop
  labels:
    app: nexshop-aiops-cockpit
spec:
  type: NodePort
  selector:
    app: nexshop-aiops-cockpit
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
      protocol: TCP
